name: PR title check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title-check:
    # Release PRs are titled by release-please (e.g. `chore(main): release
    # 1.2.3`), which the conventional-commit scope check rejects.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: glzr-io/actions/semantic-prs@main
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
